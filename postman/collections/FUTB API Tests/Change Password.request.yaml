$kind: http-request
order: 3000
method: POST
url: '{{base_url}}/api/auth/change-password/'
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "Mah@236900_New",
      "new_password": "Mah@236900_New"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Success message returned", function () {
          const json = pm.response.json();
          pm.expect(json.detail).to.eql("Password changed successfully.");
      });
